<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>專業文字特效產生器 (雙層不溢出版)</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html-to-image/1.11.1/html-to-image.min.js"></script>
    <style>
        :root { --panel-bg: #2d2d2d; --input-bg: #1a1a1a; --border-color: #444; }
        body { font-family: "Microsoft JhengHei", sans-serif; background: #121212; color: #ddd; display: flex; flex-direction: column; align-items: center; padding: 20px; margin: 0; }
        
        .preview-wrapper {
            background: #000;
            background-image: radial-gradient(#333 1px, transparent 1px);
            background-size: 20px 20px;
            padding: 40px;
            border-radius: 12px;
            margin-bottom: 20px;
            width: 100%;
            max-width: 900px;
            min-height: 300px;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 1px solid #333;
            overflow: auto;
        }

        #capture-area { 
            display: inline-flex; 
            justify-content: center; 
            align-items: center; 
            padding: 30px; 
        }

        /* 控制面板排版 */
        .controls {
            background: var(--panel-bg);
            padding: 30px;
            border-radius: 12px;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            width: 100%;
            max-width: 900px;
            box-sizing: border-box;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .section-title { grid-column: span 2; font-size: 14px; color: #aaa; border-bottom: 1px solid #444; padding-bottom: 5px; margin-top: 10px; margin-bottom: 5px; }
        .group { display: flex; flex-direction: column; gap: 8px; }
        label { font-size: 13px; color: #ccc; }
        
        /* 修正 Input 樣式，排除 type="color" 和 type="range" */
        input[type="text"], input[type="number"], select, input[type="file"] {
            padding: 10px; background: var(--input-bg); border: 1px solid var(--border-color); color: white; border-radius: 6px; box-sizing: border-box; width: 100%;
        }

        /* 顏色選取器 UI 修復 */
        .color-group { display: flex; gap: 10px; align-items: center; }
        input[type="color"] {
            -webkit-appearance: none; border: none; width: 45px; height: 40px; border-radius: 6px; cursor: pointer; background: transparent; padding: 0;
        }
        input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
        input[type="color"]::-webkit-color-swatch { border: 1px solid #555; border-radius: 6px; }
        .color-group input[type="text"] { flex: 1; font-family: monospace; text-transform: uppercase; }

        .slider-group { display: flex; gap: 10px; align-items: center; }
        input[type="range"] { flex: 1; cursor: pointer; }
        .slider-group input[type="number"] { width: 70px; text-align: center; }

        .btn-group { grid-column: span 2; margin-top: 20px; }
        button {
            width: 100%; padding: 15px; border: none; border-radius: 8px; cursor: pointer;
            font-weight: bold; background: #007acc; color: white; font-size: 16px; transition: 0.2s;
        }
        button:hover { background: #008be8; }
        
        #dynamic-font-style { display: none; }
    </style>
</head>
<body>

    <div class="preview-wrapper">
        <div id="capture-area">
            <svg id="svg-canvas" xmlns="http://www.w3.org/2000/svg">
                <text id="text-stroke" dominant-baseline="middle" text-anchor="middle" font-weight="bold"></text>
                <text id="text-fill" dominant-baseline="middle" text-anchor="middle" font-weight="bold"></text>
            </svg>
        </div>
    </div>

    <style id="dynamic-font-style"></style>

    <div class="controls">
        <div class="section-title">文字與字體設定</div>
        
        <div class="group">
            <label>文字內容</label>
            <input type="text" id="rawText" value="噪">
        </div>
        
        <div class="group">
            <label>字體選擇 (含上傳)</label>
            <select id="fontSelect">
                <option value="'Microsoft JhengHei', sans-serif">微軟正黑體</option>
                <option value="custom" id="customFontOption" style="display:none;">(已上傳的自訂字體)</option>
            </select>
        </div>

        <div class="group">
            <label>上傳字體檔 (.ttf / .otf)</label>
            <input type="file" id="fontUpload" accept=".ttf,.otf">
        </div>

        <div class="group">
            <label>字體大小</label>
            <div class="slider-group">
                <input type="range" id="fontSizeRange" min="20" max="400" value="150">
                <input type="number" id="fontSizeNum" min="20" max="400" value="150">
            </div>
        </div>

        <div class="section-title">色彩與特效設定</div>

        <div class="group">
            <label>文字填色</label>
            <div class="color-group">
                <input type="color" id="fillColorPicker" value="#ff6b52">
                <input type="text" id="fillColorHex" value="#ff6b52" maxlength="7">
            </div>
        </div>

        <div class="group">
            <label>外圍描邊顏色</label>
            <div class="color-group">
                <input type="color" id="strokeColorPicker" value="#000000">
                <input type="text" id="strokeColorHex" value="#000000" maxlength="7">
            </div>
        </div>

        <div class="group">
            <label>描邊粗細</label>
            <div class="slider-group">
                <input type="range" id="strokeWidthRange" min="0" max="80" value="15">
                <input type="number" id="strokeWidthNum" min="0" max="80" value="15">
            </div>
            
            <label style="margin-top:10px;">描邊轉角樣式</label>
            <select id="strokeJoinSelect">
                <option value="round">圓角 (Round) - 推薦</option>
                <option value="miter">尖角 (Miter)</option>
                <option value="bevel">斜切 (Bevel)</option>
            </select>
        </div>

        <div class="group">
            <label>光暈顏色</label>
            <div class="color-group">
                <input type="color" id="glowColorPicker" value="#000000">
                <input type="text" id="glowColorHex" value="#000000" maxlength="7">
            </div>
            <label style="margin-top:10px;">光暈大小</label>
            <div class="slider-group">
                <input type="range" id="glowBlurRange" min="0" max="100" value="0">
                <input type="number" id="glowBlurNum" min="0" max="100" value="0">
            </div>
        </div>

        <div class="btn-group">
            <button onclick="exportPNG()">下載高品質 PNG (保證不溢出)</button>
        </div>
    </div>

    <script>
        const textStroke = document.getElementById('text-stroke');
        const textFill = document.getElementById('text-fill');
        const svgCanvas = document.getElementById('svg-canvas');
        const fontStyle = document.getElementById('dynamic-font-style');
        const fontSelect = document.getElementById('fontSelect');
        const customFontOption = document.getElementById('customFontOption');
        let hasCustomFont = false;

        // UI 雙向綁定邏輯
        function syncColorInputs(pickerId, hexId) {
            const picker = document.getElementById(pickerId);
            const hex = document.getElementById(hexId);
            picker.addEventListener('input', (e) => { hex.value = e.target.value.toUpperCase(); updateEffect(); });
            hex.addEventListener('input', (e) => {
                let val = e.target.value;
                if (!val.startsWith('#')) val = '#' + val;
                if (/^#[0-9A-F]{6}$/i.test(val)) { picker.value = val; updateEffect(); }
            });
        }
        syncColorInputs('fillColorPicker', 'fillColorHex');
        syncColorInputs('strokeColorPicker', 'strokeColorHex');
        syncColorInputs('glowColorPicker', 'glowColorHex');

        function syncSliderAndNum(rangeId, numId) {
            const range = document.getElementById(rangeId);
            const num = document.getElementById(numId);
            range.addEventListener('input', (e) => { num.value = e.target.value; updateEffect(); });
            num.addEventListener('input', (e) => { range.value = e.target.value; updateEffect(); });
        }
        syncSliderAndNum('fontSizeRange', 'fontSizeNum');
        syncSliderAndNum('strokeWidthRange', 'strokeWidthNum');
        syncSliderAndNum('glowBlurRange', 'glowBlurNum');

        // 字體上傳與 Base64 轉換
        document.getElementById('fontUpload').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(event) {
                const base64Font = event.target.result.split(',')[1];
                const fontFormat = file.name.toLowerCase().endsWith('.otf') ? 'opentype' : 'truetype';
                // 寫入 CSS 確保匯出時能抓到
                fontStyle.innerHTML = `@font-face { font-family: 'MyCustomFont'; src: url(data:font/${fontFormat};base64,${base64Font}); }`;
                hasCustomFont = true;
                customFontOption.style.display = 'block';
                fontSelect.value = 'custom';
                document.fonts.ready.then(() => updateEffect());
            };
            reader.readAsDataURL(file);
        });

        // 監聽變數改變
        document.getElementById('rawText').addEventListener('input', updateEffect);
        fontSelect.addEventListener('change', updateEffect);
        document.getElementById('strokeJoinSelect').addEventListener('change', updateEffect);

        // 核心渲染邏輯 (雙層 SVG)
        function updateEffect() {
            const text = document.getElementById('rawText').value;
            const size = Number(document.getElementById('fontSizeNum').value);
            const fill = document.getElementById('fillColorHex').value;
            const sColor = document.getElementById('strokeColorHex').value;
            // 由於 SVG 邊框是從路徑向內外長，為了達到完全外擴，邊框數值需乘以 2
            const sWidth = Number(document.getElementById('strokeWidthNum').value) * 2; 
            const gColor = document.getElementById('glowColorHex').value;
            const gBlur = Number(document.getElementById('glowBlurNum').value);
            const sJoin = document.getElementById('strokeJoinSelect').value;

            // 決定字體
            const fontFamily = fontSelect.value === 'custom' ? "'MyCustomFont', sans-serif" : fontSelect.value;

            // --- 頂層設定 (純填色) ---
            textFill.textContent = text;
            textFill.style.fontFamily = fontFamily;
            textFill.style.fontSize = size + 'px';
            textFill.style.fill = fill;
            textFill.style.stroke = 'none'; // 頂層絕對不加描邊

            // --- 底層設定 (純描邊與陰影) ---
            textStroke.textContent = text;
            textStroke.style.fontFamily = fontFamily;
            textStroke.style.fontSize = size + 'px';
            textStroke.style.fill = sColor; // 底層填滿描邊色，防止字體內部有空隙
            textStroke.style.stroke = sColor;
            textStroke.style.strokeWidth = sWidth + 'px';
            textStroke.style.strokeLinejoin = sJoin;
            
            if (gBlur > 0) {
                textStroke.style.filter = `drop-shadow(0px 0px ${gBlur}px ${gColor})`;
            } else {
                textStroke.style.filter = 'none';
            }

            // 動態計算 SVG 畫布大小，確保下載時不被裁切
            setTimeout(() => {
                const bbox = textFill.getBBox(); // 以頂層文字為基準計算
                if(bbox.width === 0) return;
                
                const padding = (sWidth / 2) + gBlur + 50; 
                const canvasWidth = bbox.width + padding * 2;
                const canvasHeight = bbox.height + padding * 2;

                svgCanvas.setAttribute('width', canvasWidth);
                svgCanvas.setAttribute('height', canvasHeight);
                
                const centerX = canvasWidth / 2;
                const centerY = canvasHeight / 2;
                
                textStroke.setAttribute('x', centerX);
                textStroke.setAttribute('y', centerY);
                textFill.setAttribute('x', centerX);
                textFill.setAttribute('y', centerY);
            }, 50);
        }

        // 匯出功能
        async function exportPNG() {
            const captureArea = document.getElementById('capture-area');
            const btn = document.querySelector('button');
            const originalText = btn.innerText;
            btn.innerText = "處理中...";
            
            try {
                const options = { 
                    backgroundColor: null, 
                    skipStep: false,
                    pixelRatio: 2 // 提升下載圖片的解析度
                };
                if (hasCustomFont) {
                    options.fontEmbedCSS = fontStyle.innerHTML;
                }

                // 強制套用套件匯出
                const dataUrl = await htmlToImage.toPng(captureArea, options);
                const link = document.createElement('a');
                link.download = `text-effect-${Date.now()}.png`;
                link.href = dataUrl;
                link.click();
            } catch (error) {
                console.error('匯出失敗', error);
                alert('匯出失敗，請確保字體檔案正確。');
            } finally {
                btn.innerText = originalText;
            }
        }

        // 初始化
        window.onload = () => setTimeout(updateEffect, 100);
    </script>
</body>
</html>
