<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>極行 Theme Designer</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0a0a0a; color: #e0e0e0; min-height: 100vh; }

  .app-layout { display: flex; height: 100vh; overflow: hidden; }

  /* === Left: Phone Preview === */
  .preview-panel { flex: 1; display: flex; align-items: center; justify-content: center; gap: 24px; padding: 20px; overflow: auto; min-width: 0; }

  .phone-frame {
    width: 375px; height: 750px; border-radius: 40px; overflow: hidden;
    border: 3px solid #333; position: relative; flex-shrink: 0;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    transition: background-color 0.3s;
  }
  .phone-label {
    text-align: center; margin-bottom: 8px; font-size: 13px; color: #888;
    font-weight: 600; letter-spacing: 1px;
  }

  /* === Right: Editor Panel === */
  .editor-panel {
    width: 400px; background: #141414; border-left: 1px solid #222;
    overflow-y: auto; padding: 20px; flex-shrink: 0;
  }
  .editor-panel h2 { font-size: 16px; margin-bottom: 16px; color: #fff; }
  .editor-section-title {
    font-size: 12px; margin: 20px 0 10px; color: #666; text-transform: uppercase;
    letter-spacing: 1px; font-weight: 700;
    display: flex; align-items: center; gap: 8px;
  }
  .editor-section-title::after {
    content: ''; flex: 1; height: 1px; background: #222;
  }

  /* Theme management bar */
  .theme-management { margin-bottom: 20px; }
  .theme-list { display: flex; flex-direction: column; gap: 4px; margin-bottom: 10px; }
  .theme-item {
    display: flex; align-items: center; gap: 8px; padding: 8px 12px;
    border-radius: 10px; cursor: pointer; transition: all 0.2s;
    border: 1.5px solid transparent; background: transparent;
  }
  .theme-item:hover { background: rgba(255,255,255,0.04); }
  .theme-item.active { border-color: #3B82F6; background: rgba(59,130,246,0.08); }
  .theme-item-preview {
    width: 28px; height: 28px; border-radius: 8px; flex-shrink: 0;
    border: 1px solid rgba(255,255,255,0.1); overflow: hidden;
    display: flex; flex-direction: column;
  }
  .theme-item-preview-top { flex: 1; }
  .theme-item-preview-bot { flex: 0 0 6px; }
  .theme-item-name {
    flex: 1; font-size: 13px; color: #ccc; background: none; border: none;
    outline: none; font-family: inherit; cursor: pointer; min-width: 0;
  }
  .theme-item.active .theme-item-name { color: #fff; }
  .theme-item-name:focus { cursor: text; border-bottom: 1px solid #3B82F6; }
  .theme-item-badge {
    font-size: 10px; padding: 2px 6px; border-radius: 4px;
    background: rgba(255,255,255,0.06); color: #888;
  }
  .theme-item-delete {
    width: 24px; height: 24px; border-radius: 6px; display: flex;
    align-items: center; justify-content: center; font-size: 14px;
    color: #666; cursor: pointer; transition: all 0.2s;
    background: transparent; border: none; opacity: 0;
  }
  .theme-item:hover .theme-item-delete { opacity: 1; }
  .theme-item-delete:hover { background: rgba(239,68,68,0.15); color: #ef4444; }

  .theme-actions { display: flex; gap: 6px; }
  .theme-action-btn {
    flex: 1; padding: 8px; border-radius: 8px; border: 1px dashed #333;
    background: transparent; color: #888; font-size: 12px; cursor: pointer;
    transition: all 0.2s; display: flex; align-items: center;
    justify-content: center; gap: 4px;
  }
  .theme-action-btn:hover { border-color: #3B82F6; color: #3B82F6; background: rgba(59,130,246,0.05); }

  /* isDark toggle */
  .toggle-row { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; padding: 8px 12px; border-radius: 10px; background: rgba(255,255,255,0.03); }
  .toggle-label { font-size: 13px; color: #aaa; flex: 1; }
  .toggle {
    width: 44px; height: 24px; border-radius: 12px; background: #333;
    position: relative; cursor: pointer; transition: background 0.2s; flex-shrink: 0;
  }
  .toggle.on { background: #3B82F6; }
  .toggle::after {
    content: ''; position: absolute; width: 18px; height: 18px; border-radius: 50%;
    background: #fff; top: 3px; left: 3px; transition: transform 0.2s;
  }
  .toggle.on::after { transform: translateX(20px); }

  /* Color row */
  .color-row {
    display: flex; align-items: center; gap: 10px; margin-bottom: 4px;
    padding: 8px 10px; border-radius: 10px; transition: background 0.15s;
  }
  .color-row:hover { background: rgba(255,255,255,0.04); }
  .color-label { flex: 1; font-size: 12px; color: #aaa; line-height: 1.3; }
  .color-label-desc { display: block; font-size: 10px; color: #555; margin-top: 1px; }
  .color-input-wrap { position: relative; width: 32px; height: 32px; border-radius: 8px; overflow: hidden; border: 1px solid #333; flex-shrink: 0; }
  .color-input-wrap input[type="color"] {
    position: absolute; top: -4px; left: -4px; width: 40px; height: 40px;
    border: none; cursor: pointer; background: none;
  }
  .color-hex {
    width: 80px; background: #1a1a1a; border: 1px solid #333; border-radius: 6px;
    padding: 4px 8px; color: #ddd; font-size: 12px; font-family: monospace;
    text-align: center;
  }
  /* Alpha slider */
  .alpha-slider-wrap {
    display: flex; align-items: center; gap: 6px;
  }
  .alpha-slider {
    width: 60px; -webkit-appearance: none; appearance: none; height: 4px;
    border-radius: 2px; background: linear-gradient(to right, transparent, #fff);
    outline: none;
  }
  .alpha-slider::-webkit-slider-thumb {
    -webkit-appearance: none; width: 14px; height: 14px; border-radius: 50%;
    background: #fff; border: 2px solid #555; cursor: pointer;
  }
  .alpha-value { font-size: 10px; color: #666; width: 28px; text-align: right; }

  /* Buttons */
  .btn-row { display: flex; gap: 8px; margin-top: 20px; }
  .btn {
    flex: 1; padding: 12px; border-radius: 10px; border: none; font-size: 13px;
    font-weight: 600; cursor: pointer; transition: all 0.2s;
  }
  .btn-primary { background: #3B82F6; color: #fff; }
  .btn-primary:hover { background: #2563EB; }
  .btn-secondary { background: #222; color: #ccc; border: 1px solid #333; }
  .btn-secondary:hover { background: #2a2a2a; }
  .btn-danger { background: transparent; color: #ef4444; border: 1px solid rgba(239,68,68,0.3); }
  .btn-danger:hover { background: rgba(239,68,68,0.1); }

  /* JSON output */
  .json-output {
    margin-top: 12px; background: #0d0d0d; border: 1px solid #222;
    border-radius: 10px; padding: 12px; font-family: monospace; font-size: 11px;
    color: #8be9fd; max-height: 300px; overflow-y: auto; white-space: pre-wrap;
    word-break: break-all; display: none;
  }
  .json-output.show { display: block; }
  .json-toggle-btn {
    margin-top: 8px; background: none; border: none; color: #555; font-size: 12px;
    cursor: pointer; padding: 4px; width: 100%; text-align: center;
  }
  .json-toggle-btn:hover { color: #888; }

  /* Draft status bar */
  .draft-bar {
    display: flex; align-items: center; gap: 8px; padding: 8px 12px;
    border-radius: 10px; margin-bottom: 16px; font-size: 12px;
    background: rgba(234,179,8,0.1); border: 1px solid rgba(234,179,8,0.25); color: #eab308;
  }
  .draft-bar.synced {
    background: rgba(34,197,94,0.08); border-color: rgba(34,197,94,0.2); color: #22c55e;
  }
  .draft-bar-dot {
    width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
  }
  .draft-bar .draft-bar-dot { background: #eab308; }
  .draft-bar.synced .draft-bar-dot { background: #22c55e; }
  .draft-bar-text { flex: 1; }
  .draft-bar-action {
    background: none; border: 1px solid currentColor; border-radius: 6px;
    color: inherit; padding: 3px 10px; font-size: 11px; cursor: pointer;
    font-weight: 600; transition: all 0.2s;
  }
  .draft-bar-action:hover { opacity: 0.8; }

  /* Toast */
  .toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    background: #22c55e; color: #fff; padding: 10px 24px; border-radius: 10px;
    font-size: 14px; font-weight: 600; opacity: 0; transition: opacity 0.3s;
    pointer-events: none; z-index: 999;
  }
  .toast.show { opacity: 1; }

  /* Body lock for mobile editor */
  body.editor-open { overflow: hidden; }
  body.editor-open .preview-panel { pointer-events: none; }

  /* Confirm dialog */
  .confirm-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: flex;
    align-items: center; justify-content: center; z-index: 1000; opacity: 0;
    pointer-events: none; transition: opacity 0.2s;
  }
  .confirm-overlay.show { opacity: 1; pointer-events: all; }
  .confirm-dialog {
    background: #1a1a1a; border: 1px solid #333; border-radius: 16px;
    padding: 24px; max-width: 320px; width: 90%; text-align: center;
  }
  .confirm-dialog h3 { font-size: 16px; color: #fff; margin-bottom: 8px; }
  .confirm-dialog p { font-size: 13px; color: #888; margin-bottom: 20px; }
  .confirm-dialog .btn-row { margin-top: 0; }

  /* Mobile bottom sheet */
  .mobile-editor-toggle {
    display: none; position: fixed; bottom: 16px; right: 16px; z-index: 100;
    width: 56px; height: 56px; border-radius: 50%; background: #3B82F6;
    color: #fff; border: none; font-size: 24px; cursor: pointer;
    box-shadow: 0 4px 20px rgba(59,130,246,0.4);
    align-items: center; justify-content: center;
  }
  .mobile-editor-toggle:active { transform: scale(0.95); }

  /* ========== Phone inner styles ========== */

  /* Status bar */
  .status-bar { height: 44px; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600; }

  /* Home screen */
  .home-screen { height: 100%; display: flex; flex-direction: column; position: relative; }
  .home-content { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; }

  /* Speed display */
  .speed-display { text-align: center; }
  .speed-number { font-size: 120px; font-weight: 200; line-height: 1; font-variant-numeric: tabular-nums; }
  .speed-unit { font-size: 16px; opacity: 0.5; margin-top: 4px; }
  .speed-limit-badge {
    position: absolute; top: 60px; right: 20px;
    width: 56px; height: 56px; border-radius: 50%;
    border: 4px solid #E57373; display: flex; align-items: center;
    justify-content: center; font-size: 20px; font-weight: 700;
  }

  /* Event card */
  .event-card {
    position: absolute; top: 20px; left: 16px; right: 16px;
    border-radius: 16px; padding: 14px 16px;
    display: flex; align-items: center; gap: 12px;
  }
  .event-icon { width: 36px; height: 36px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 18px; }
  .event-info { flex: 1; }
  .event-title { font-size: 14px; font-weight: 600; }
  .event-dist { font-size: 22px; font-weight: 700; }
  .event-sub { font-size: 11px; opacity: 0.6; }

  /* Bottom bar */
  .bottom-bar {
    position: absolute; bottom: 0; left: 50%; transform: translateX(-50%);
    width: 140px; height: 60px; border-radius: 48px 48px 0 0;
    display: flex; align-items: center; justify-content: space-around;
    backdrop-filter: blur(10px);
  }
  .bottom-bar-icon { font-size: 24px; opacity: 0.9; cursor: pointer; }

  /* --- Menu screen --- */
  .menu-screen { height: 100%; display: flex; flex-direction: column; overflow-y: auto; }
  .menu-content { padding: 20px; flex: 1; }
  .menu-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 28px; }
  .menu-logo { width: 42px; height: 42px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 20px; }
  .menu-app-name { font-size: 16px; font-weight: 700; margin-left: 10px; }
  .menu-close { font-size: 22px; opacity: 0.5; cursor: pointer; }

  .menu-cards { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 28px; }
  .menu-card {
    border-radius: 20px; padding: 14px; height: 90px;
    display: flex; flex-direction: column; justify-content: space-between;
    cursor: pointer; transition: transform 0.15s;
  }
  .menu-card:hover { transform: scale(1.02); }
  .menu-card-icon { font-size: 22px; }
  .menu-card-title { font-size: 13px; font-weight: 500; }

  .menu-section-title { font-size: 13px; opacity: 0.4; font-weight: 700; margin-bottom: 10px; }
  .menu-section-group { border-radius: 16px; margin-bottom: 24px; overflow: hidden; }
  .menu-list-item {
    display: flex; align-items: center; gap: 14px; padding: 14px 18px;
    cursor: pointer; transition: background 0.15s;
  }
  .menu-list-item:hover { filter: brightness(1.1); }
  .menu-list-item-icon { font-size: 18px; opacity: 0.6; }
  .menu-list-item-text { flex: 1; font-size: 13px; opacity: 0.9; }
  .menu-list-item-arrow { font-size: 12px; opacity: 0.2; }

  /* Social row */
  .social-row { display: flex; justify-content: center; gap: 14px; margin-top: 20px; }
  .social-btn { width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 18px; cursor: pointer; }

  /* Theme dialog preview */
  .theme-dialog-screen { height: 100%; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,0.6); }
  .theme-dialog-inner { text-align: center; }
  .theme-dialog-title {
    display: inline-flex; align-items: center; gap: 10px;
    background: rgba(15,26,45,0.7); border-radius: 14px; padding: 8px 24px; margin-bottom: 18px;
  }
  .theme-dialog-bar { width: 4px; height: 18px; background: #3B82F6; border-radius: 2px; }
  .theme-dialog-text { font-size: 15px; font-weight: 600; color: #fff; }
  .theme-grid { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
  .theme-card-mini {
    width: 88px; height: 88px; border-radius: 16px; overflow: hidden;
    border: 1.5px solid rgba(255,255,255,0.2); cursor: pointer;
    display: flex; flex-direction: column;
  }
  .theme-card-mini.selected { border-color: #fff; border-width: 2.5px; box-shadow: 0 0 12px rgba(255,255,255,0.25); }
  .theme-card-top { flex: 3; display: flex; align-items: center; justify-content: center; gap: 5px; }
  .theme-card-dot { width: 18px; height: 18px; border-radius: 50%; }
  .theme-card-accent { width: 24px; height: 7px; border-radius: 4px; }
  .theme-card-bottom { padding: 4px 0; text-align: center; font-size: 11px; font-weight: 600; }

  /* Responsive */

  @media (max-width: 1400px) {
    .phone-frame { width: 300px; height: 600px; border-radius: 32px; }
    .preview-panel { gap: 16px; padding: 16px; }
    .editor-panel { width: 360px; padding: 16px; }
  }

  @media (max-width: 1100px) {
    .phone-frame { width: 260px; height: 520px; border-radius: 28px; }
    .preview-panel { flex-wrap: wrap; justify-content: center; gap: 16px; padding: 16px; }
    .editor-panel { width: 340px; }
    .speed-number { font-size: 80px !important; }
    .speed-limit-badge { width: 44px !important; height: 44px !important; font-size: 16px !important; border-width: 3px !important; top: 45px !important; right: 14px !important; }
    .event-card { padding: 10px 12px !important; border-radius: 12px !important; }
    .event-dist { font-size: 18px !important; }
    .event-icon { width: 30px !important; height: 30px !important; font-size: 15px !important; }
  }

  /* Medium: stack layout */
  @media (max-width: 900px) {
    .app-layout { flex-direction: column; height: auto; min-height: 100vh; }
    .preview-panel { flex-wrap: wrap; justify-content: center; gap: 20px; padding: 20px; min-height: auto; }
    .editor-panel {
      position: fixed; bottom: 0; left: 0; right: 0; width: 100%;
      border-left: none; border-top: 1px solid #333;
      max-height: 70vh; z-index: 50; border-radius: 20px 20px 0 0;
      transform: translateY(100%); transition: transform 0.3s ease;
      box-shadow: 0 -10px 40px rgba(0,0,0,0.5);
    }
    .editor-panel.open { transform: translateY(0); }
    .editor-panel-handle {
      display: flex; justify-content: center; padding: 10px; cursor: pointer;
    }
    .editor-panel-handle::before {
      content: ''; width: 36px; height: 4px; border-radius: 2px; background: #444;
    }
    .mobile-editor-toggle { display: flex; }
    .phone-frame { width: 280px; height: 560px; border-radius: 30px; }
    .preview-panel { padding-bottom: 80px; }
  }

  @media (max-width: 700px) {
    .phone-frame { width: 240px; height: 480px; border-radius: 26px; }
    .preview-panel { gap: 14px; padding: 14px; padding-bottom: 80px; }
    .speed-number { font-size: 64px !important; }
    .event-card { top: 14px !important; left: 10px !important; right: 10px !important; padding: 8px 10px !important; }
    .event-title { font-size: 12px !important; }
    .event-dist { font-size: 16px !important; }
    .event-sub { font-size: 10px !important; }
    .menu-cards { gap: 8px !important; }
    .menu-card { height: 70px !important; padding: 10px !important; border-radius: 14px !important; }
    .menu-card-icon { font-size: 18px !important; }
    .menu-card-title { font-size: 11px !important; }
    .menu-list-item { padding: 10px 14px !important; }
    .theme-card-mini { width: 72px !important; height: 72px !important; border-radius: 12px !important; }
    .theme-grid { gap: 8px !important; }
  }

  @media (max-width: 500px) {
    .phone-frame { width: 200px; height: 400px; border-radius: 22px; }
    .preview-panel { flex-direction: column; align-items: center; gap: 12px; padding: 12px; padding-bottom: 80px; }
    .phone-label { font-size: 11px; }
    .editor-panel { padding: 14px; max-height: 80vh; }
    .editor-panel h2 { font-size: 14px; }
    .color-row { gap: 6px; padding: 6px; }
    .color-label { font-size: 11px; }
    .color-hex { width: 70px; font-size: 11px; }
    .btn { padding: 10px; font-size: 12px; }
    .speed-number { font-size: 48px !important; }
    .speed-unit { font-size: 12px !important; }
    .speed-limit-badge { width: 36px !important; height: 36px !important; font-size: 13px !important; border-width: 2.5px !important; top: 35px !important; right: 10px !important; }
    .status-bar { height: 30px !important; font-size: 10px !important; }
    .event-card { top: 8px !important; left: 8px !important; right: 8px !important; padding: 6px 8px !important; gap: 8px !important; border-radius: 10px !important; }
    .event-icon { width: 24px !important; height: 24px !important; font-size: 12px !important; border-radius: 6px !important; }
    .event-title { font-size: 11px !important; }
    .event-dist { font-size: 14px !important; }
    .event-sub { font-size: 9px !important; }
    .bottom-bar { width: 100px !important; height: 40px !important; border-radius: 30px 30px 0 0 !important; }
    .bottom-bar-icon { font-size: 18px !important; }
    .menu-content { padding: 12px !important; }
    .menu-header { margin-bottom: 16px !important; }
    .menu-logo { width: 32px !important; height: 32px !important; font-size: 14px !important; }
    .menu-app-name { font-size: 13px !important; }
    .menu-cards { gap: 6px !important; }
    .menu-card { height: 56px !important; padding: 8px !important; border-radius: 12px !important; }
    .menu-card-icon { font-size: 14px !important; }
    .menu-card-title { font-size: 10px !important; }
    .menu-section-title { font-size: 11px !important; margin-bottom: 6px !important; }
    .menu-list-item { padding: 8px 12px !important; gap: 10px !important; }
    .menu-list-item-icon { font-size: 14px !important; }
    .menu-list-item-text { font-size: 11px !important; }
    .social-btn { width: 34px !important; height: 34px !important; font-size: 11px !important; }
    .social-row { margin-top: 12px !important; gap: 10px !important; }
    .theme-card-mini { width: 56px !important; height: 56px !important; border-radius: 10px !important; }
    .theme-grid { gap: 6px !important; }
    .theme-dialog-text { font-size: 12px !important; }
    .theme-dialog-title { padding: 6px 16px !important; margin-bottom: 12px !important; }
    .theme-card-dot { width: 12px !important; height: 12px !important; }
    .theme-card-accent { width: 16px !important; height: 5px !important; }
    .theme-card-bottom { font-size: 9px !important; }
    .alpha-slider { width: 40px; }
  }
</style>
</head>
<body>

<div class="app-layout">
  <!-- Phone Previews -->
  <div class="preview-panel">
    <div>
      <div class="phone-label">首頁</div>
      <div class="phone-frame" id="phone-home"></div>
    </div>
    <div>
      <div class="phone-label">側邊選單</div>
      <div class="phone-frame" id="phone-menu"></div>
    </div>
    <div>
      <div class="phone-label">主題選擇器</div>
      <div class="phone-frame" id="phone-theme-dialog"></div>
    </div>
  </div>

  <!-- Editor Panel -->
  <div class="editor-panel" id="editor-panel">
    <div class="editor-panel-handle" style="display:none;" id="editor-handle" onclick="toggleEditorPanel()"></div>
    <h2>極行 Theme Designer</h2>

    <!-- Theme Management -->
    <div class="theme-management">
      <div class="editor-section-title">主題列表</div>
      <div class="theme-list" id="theme-list"></div>
      <div class="theme-actions">
        <button class="theme-action-btn" onclick="addNewTheme()">+ 新增主題</button>
        <button class="theme-action-btn" onclick="duplicateTheme()">複製目前主題</button>
      </div>
    </div>

    <!-- Current theme settings -->
    <div class="toggle-row">
      <span class="toggle-label">深色模式</span>
      <div class="toggle" id="toggle-dark" onclick="toggleDark()"></div>
    </div>

    <div class="editor-section-title">背景與表面</div>
    <div id="colors-surface"></div>

    <div class="editor-section-title">品牌色</div>
    <div id="colors-brand"></div>

    <div class="editor-section-title">文字顏色</div>
    <div id="colors-text"></div>

    <div class="editor-section-title">邊框與分隔線</div>
    <div id="colors-border"></div>

    {"id":"oceanNight","value":4,"name":"海藍夜","isDark":true,"colors":{"backColor":"#FF0D1B2A","surfaceColor":"#FF152638","primaryColor":"#FF1A3A5C","primaryDark":"#FF0F2A44","accentColor":"#FF2563EB","textColor":"#FFE2EAF4","textSecondary":"#FF94A3B8","surfaceDim":"#FF0A1628","surfaceBright":"#FF1A2D42","borderColor":"#0FFFFFFF","dividerColor":"#0DFFFFFF"}}

// Color property labels — friendly names + descriptions
const colorMeta = {
  backColor:      { label: '背景色',   desc: 'App 的主要底色' },

const colorGroups = {
  surface: ['backColor', 'surfaceColor', 'surfaceDim', 'surfaceBright'],

};

// State
let currentThemeIndex = 0;
let themes = JSON.parse(JSON.stringify(themesData.themes));
let pendingConfirmAction = null;
let isMobileEditorOpen = false;

// === ARGB Hex Helpers ===
function argbToRgba(argb) {
  const hex = argb.replace('#', '');
  const a = parseInt(hex.substring(0, 2), 16) / 255;
  const r = parseInt(hex.substring(2, 4), 16);
  const g = parseInt(hex.substring(4, 6), 16);
  const b = parseInt(hex.substring(6, 8), 16);
  return { r, g, b, a };
}

function rgbaToArgb(r, g, b, a) {
  const ah = Math.round(a * 255).toString(16).padStart(2, '0').toUpperCase();
  const rh = r.toString(16).padStart(2, '0').toUpperCase();
  const gh = g.toString(16).padStart(2, '0').toUpperCase();
  const bh = b.toString(16).padStart(2, '0').toUpperCase();
  return `#${ah}${rh}${gh}${bh}`;
}

function argbToCssColor(argb) {
  const { r, g, b, a } = argbToRgba(argb);
  return `rgba(${r},${g},${b},${a.toFixed(3)})`;
}

function argbToHexInput(argb) {
  const hex = argb.replace('#', '');
  return '#' + hex.substring(2);
}

function hexInputToArgb(hexInput, originalArgb) {
  const origAlpha = originalArgb.replace('#', '').substring(0, 2);
  const rgb = hexInput.replace('#', '').toUpperCase();
  return `#${origAlpha}${rgb}`;
}

function getAlphaFromArgb(argb) {
  return parseInt(argb.replace('#', '').substring(0, 2), 16);
}

function setAlphaInArgb(argb, alpha255) {
  const hex = argb.replace('#', '');
  const ah = Math.round(alpha255).toString(16).padStart(2, '0').toUpperCase();
  return `#${ah}${hex.substring(2)}`;
}

function ct() { return themes[currentThemeIndex]; }
function cc() { return ct().colors; }

// === Theme Management ===
function buildThemeList() {
  const container = document.getElementById('theme-list');
  container.innerHTML = '';
  themes.forEach((t, i) => {
    const tc = t.colors;
    const item = document.createElement('div');
    item.className = 'theme-item' + (i === currentThemeIndex ? ' active' : '');
    item.innerHTML = `
      <div class="theme-item-preview">
        <div class="theme-item-preview-top" style="background:${argbToCssColor(tc.backColor)}"></div>
        <div class="theme-item-preview-bot" style="background:${argbToCssColor(tc.accentColor)}"></div>
      </div>
      <input class="theme-item-name" type="text" value="${escapeHtml(t.name)}"
        data-index="${i}"
        onfocus="this.select()"
        onchange="renameTheme(${i}, this.value)"
        onclick="event.stopPropagation()">
      <span class="theme-item-badge">${t.isDark ? '深' : '淺'}</span>
      ${themes.length > 1 ? `<button class="theme-item-delete" onclick="event.stopPropagation(); deleteThemeConfirm(${i})" title="刪除主題">&#10005;</button>` : ''}
    `;
    item.addEventListener('click', (e) => {
      if (e.target.tagName !== 'INPUT' && e.target.tagName !== 'BUTTON') {
        currentThemeIndex = i;
        render();
      }
    });
    container.appendChild(item);
  });
}

function escapeHtml(str) {
  return str.replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function renameTheme(index, newName) {
  const trimmed = newName.trim();
  if (trimmed) {
    themes[index].name = trimmed;
    // Also update id to match (slug)
    themes[index].id = trimmed.replace(/\s+/g, '_').toLowerCase();
    render();
  }
}

function addNewTheme() {
  const newIndex = themes.length;
  const isDark = true;
  themes.push({
    id: 'custom_' + Date.now(),
    value: newIndex,
    name: '新主題 ' + (newIndex + 1),
    isDark: isDark,
    colors: {
      backColor: '#FF1A1A2E',
      surfaceColor: '#FF252540',
      primaryColor: '#FF3B3B6B',
      primaryDark: '#FF2A2A50',
      accentColor: '#FF6366F1',
      textColor: '#FFFFFFFF',
      textSecondary: '#99FFFFFF',
      surfaceDim: '#FF121225',
      surfaceBright: '#FF2D2D48',
      borderColor: '#0FFFFFFF',
      dividerColor: '#0DFFFFFF',
    }
  });
  currentThemeIndex = newIndex;
  render();
  // Focus the name input for immediate editing
  setTimeout(() => {
    const nameInputs = document.querySelectorAll('.theme-item-name');
    const lastInput = nameInputs[nameInputs.length - 1];
    if (lastInput) { lastInput.focus(); lastInput.select(); }
  }, 50);
}

function duplicateTheme() {
  const source = JSON.parse(JSON.stringify(ct()));
  source.id = source.id + '_copy_' + Date.now();
  source.name = source.name + ' (副本)';
  source.value = themes.length;
  themes.push(source);
  currentThemeIndex = themes.length - 1;
  render();
}

function deleteThemeConfirm(index) {
  if (themes.length <= 1) {
    showToast('至少要保留一個主題');
    return;
  }
  pendingConfirmAction = () => {
    themes.splice(index, 1);
    // Reindex values
    themes.forEach((t, i) => t.value = i);
    if (currentThemeIndex >= themes.length) currentThemeIndex = themes.length - 1;
    render();
    showToast('主題已刪除');
  };
  document.getElementById('confirm-title').textContent = '刪除主題';
  document.getElementById('confirm-msg').textContent = `確定要刪除「${themes[index].name}」嗎？此操作無法還原。`;
  document.getElementById('confirm-ok').textContent = '刪除';
  document.getElementById('confirm-overlay').classList.add('show');
}

function closeConfirm() {
  document.getElementById('confirm-overlay').classList.remove('show');
  pendingConfirmAction = null;
  // Reset confirm button style
  const okBtn = document.getElementById('confirm-ok');
  okBtn.style.color = '';
  okBtn.style.borderColor = '';
}

function confirmAction() {
  if (pendingConfirmAction) pendingConfirmAction();
  closeConfirm();
}

// === Build Editor ===
function buildColorGroup(containerId, keys) {
  const container = document.getElementById(containerId);
  container.innerHTML = '';
  keys.forEach(key => {
    const val = cc()[key];
    const meta = colorMeta[key];
    const alpha = getAlphaFromArgb(val);
    const alphaPercent = Math.round(alpha / 255 * 100);

    const row = document.createElement('div');
    row.className = 'color-row';
    row.innerHTML = `
      <span class="color-label">
        ${meta.label}
        <span class="color-label-desc">${meta.desc}</span>
      </span>
      <div class="color-input-wrap" style="background:${argbToCssColor(val)}">
        <input type="color" value="${argbToHexInput(val)}" data-key="${key}">
      </div>
      <div class="alpha-slider-wrap">
        <input type="range" class="alpha-slider" min="0" max="255" value="${alpha}" data-key="${key}" title="透明度">
        <span class="alpha-value">${alphaPercent}%</span>
      </div>
    `;
    container.appendChild(row);

    // Color picker change — only update previews during drag, not the editor
    const colorInput = row.querySelector('input[type="color"]');
    colorInput.addEventListener('input', (e) => {
      const newArgb = hexInputToArgb(e.target.value, cc()[key]);
      cc()[key] = newArgb;
      row.querySelector('.color-input-wrap').style.background = argbToCssColor(newArgb);
      renderPreviews();
    });
    // Full rebuild after color picker closes
    colorInput.addEventListener('change', () => render());

    // Alpha slider change — only update previews, not the editor
    const slider = row.querySelector('.alpha-slider');
    const alphaLabel = row.querySelector('.alpha-value');
    slider.addEventListener('input', (e) => {
      const newAlpha = parseInt(e.target.value);
      cc()[key] = setAlphaInArgb(cc()[key], newAlpha);
      alphaLabel.textContent = Math.round(newAlpha / 255 * 100) + '%';
      row.querySelector('.color-input-wrap').style.background = argbToCssColor(cc()[key]);
      renderPreviews();
    });
    // Full rebuild only after drag ends
    slider.addEventListener('change', () => render());
  });
}

function buildEditor() {
  buildThemeList();
  buildColorGroup('colors-surface', colorGroups.surface);
  buildColorGroup('colors-brand', colorGroups.brand);
  buildColorGroup('colors-text', colorGroups.text);

}

// === JSON Preview ===
function updateJsonPreview() {
  const output = document.getElementById('json-output');
  output.textContent = JSON.stringify(ct(), null, 2);
}

function toggleJsonPreview() {
  document.getElementById('json-output').classList.toggle('show');
}

function copyJSON() {
  const output = document.getElementById('json-output');
  const text = JSON.stringify({ themes }, null, 2);
  navigator.clipboard.writeText(text).then(() => {
    showToast('已複製到剪貼簿');
  });
}

function showToast(text) {
  const toast = document.getElementById('toast');
  toast.textContent = text;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 2000);
}

const STORAGE_KEY = 'themeDesigner_draft';
const SERVER_SNAPSHOT_KEY = 'themeDesigner_serverSnapshot';
let serverSnapshot = null; // last known server state

function saveDraft() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify({ themes, currentThemeIndex }));
  showToast('草稿已儲存');
  updateDraftStatus();
}

function autoSaveDraft() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify({ themes, currentThemeIndex }));
  updateDraftStatus();
}

function loadDraft() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const data = JSON.parse(raw);
      if (data.themes && data.themes.length > 0) {
        themes = data.themes;
        currentThemeIndex = data.currentThemeIndex || 0;
        if (currentThemeIndex >= themes.length) currentThemeIndex = 0;
        return true;
      }
    }
  } catch (e) { /* ignore */ }
  return false;
}

function hasDraftChanges() {
  if (!serverSnapshot) return true;
  return JSON.stringify(themes) !== JSON.stringify(serverSnapshot);
}

function updateDraftStatus() {
  const bar = document.getElementById('draft-bar');
  const text = document.getElementById('draft-bar-text');
  if (hasDraftChanges()) {
    bar.className = 'draft-bar';
    text.textContent = '有未上傳的變更';
  } else {
    bar.className = 'draft-bar synced';
    text.textContent = '與伺服器同步';
  }
}

function discardDraftConfirm() {
  if (!serverSnapshot) {
    showToast('尚未從伺服器載入資料');
    return;
  }
  pendingConfirmAction = () => {
    themes = JSON.parse(JSON.stringify(serverSnapshot));
    currentThemeIndex = 0;
    localStorage.removeItem(STORAGE_KEY);
    render();
    updateDraftStatus();
    showToast('已還原為伺服器版本');
  };
  document.getElementById('confirm-title').textContent = '捨棄草稿';
  document.getElementById('confirm-msg').textContent = '確定要捨棄所有未上傳的修改，還原為伺服器上的版本嗎？';
  document.getElementById('confirm-ok').textContent = '捨棄';
  document.getElementById('confirm-overlay').classList.add('show');
}

function uploadToServerConfirm() {
  pendingConfirmAction = () => doUploadToServer();
  document.getElementById('confirm-title').textContent = '上傳到伺服器';
  document.getElementById('confirm-msg').textContent = '確定要將目前的主題設定覆寫到伺服器嗎？此操作會取代伺服器上的資料。';
  document.getElementById('confirm-ok').textContent = '確認上傳';
  document.getElementById('confirm-ok').style.color = '#22c55e';
  document.getElementById('confirm-ok').style.borderColor = 'rgba(34,197,94,0.3)';
  document.getElementById('confirm-overlay').classList.add('show');
}

// === Server API ===
async function loadFromServer() {
  try {
    const res = await fetch(`${API_BASE}/themes`);
    const data = await res.json();
    if (data.themes && data.themes.length > 0) {
      serverSnapshot = JSON.parse(JSON.stringify(data.themes));
      localStorage.setItem(SERVER_SNAPSHOT_KEY, JSON.stringify(data.themes));

      // Use server data if no real draft exists
      // A "real" draft means user actually made changes vs the server version
      const draftRaw = localStorage.getItem(STORAGE_KEY);
      let useServerData = true;
      if (draftRaw) {
        try {
          const draftData = JSON.parse(draftRaw);
          const draftStr = JSON.stringify(draftData.themes);
          const serverStr = JSON.stringify(data.themes);
          const defaultStr = JSON.stringify(themesData.themes);
          // Only keep draft if it differs from BOTH server and hardcoded defaults
          if (draftStr !== serverStr && draftStr !== defaultStr) {
            useServerData = false;
          }
        } catch (_) { /* corrupted draft, ignore */ }
      }
      if (useServerData) {
        themes = data.themes;
        currentThemeIndex = 0;
        localStorage.removeItem(STORAGE_KEY);
        showToast('已從伺服器載入主題');
      } else {
        showToast('已載入本地草稿（伺服器資料已快取）');
      }
    }
  } catch (e) {
    console.warn('無法連線伺服器，使用本地資料', e);
    // Try to load server snapshot from localStorage
    try {
      const snap = localStorage.getItem(SERVER_SNAPSHOT_KEY);
      if (snap) serverSnapshot = JSON.parse(snap);
    } catch (_) { /* ignore */ }
  }
  render();
  updateDraftStatus();
}

async function doUploadToServer() {
  try {
    const res = await fetch(`${API_BASE}/themes`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ themes }),
    });
    const data = await res.json();
    if (data.ok) {
      serverSnapshot = JSON.parse(JSON.stringify(themes));
      localStorage.setItem(SERVER_SNAPSHOT_KEY, JSON.stringify(themes));
      localStorage.removeItem(STORAGE_KEY);
      updateDraftStatus();
      showToast('已上傳到伺服器');
    } else {
      showToast('上傳失敗');
    }
  } catch (e) {
    console.error('上傳失敗', e);
    showToast('無法連線伺服器');
  }
}

// === Auto-save draft on every change ===
let _autoSaveEnabled = false;
const _origRender = render;
render = function() {
  _origRender();
  if (_autoSaveEnabled) autoSaveDraft();
};

// Init
setupMobileUI();
const hadDraft = loadDraft(); // load local draft first (if any)
render(); // initial render — autoSave is OFF so we don't pollute localStorage
loadFromServer().then(() => {
  _autoSaveEnabled = true; // enable auto-save only after server data is resolved
});
</script>
